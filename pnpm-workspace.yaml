# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

# Supply-chain hardening: cooldown on brand-new releases (EmDash exempt)
# and no non-registry transitive sources. (No trustPolicy: no-downgrade --
# it trips on upstream provenance regressions we don't control.)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true

# Security floors for transitive deps whose parents pin a vulnerable version
# (emdash pins zod exactly; miniflare pins undici 7 exactly). Drop each line
# once the parent ships the fixed version.
overrides:
  "zod@<4.6.6": "^4.6.6"
  "undici@>=7 <7.30.1": "^7.30.1"
