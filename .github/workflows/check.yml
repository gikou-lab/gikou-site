name: check

on:
  pull_request:
  push:
    branches: [main]

# 外の部品は commit の SHA で固定する（版の名前は付け替えられる。deploy の段は Cloudflare の鍵を持つ・2026-10-29）。
# 上げるときは、新しい版のタグの SHA に置き換え、行の末尾の版の名前も直す
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # このリポジトリは公開。外のサービスの設定の文書（settings/）は非公開の gikou-site-board に置く（keiji canon/settings.md）
      - run: test ! -e settings
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 本番の依存に high 以上の脆弱性があれば止める（gikou の共通の CI と同じ段・2026-10-29・gikou decisions/2026-10-28-security-watch.md）
      - run: pnpm audit --prod --audit-level high
      # 書体のファイル（約 380 個）を毎回 Google から取ると、たまに通信が切れて build が落ちる
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro/fonts
          key: astro-fonts-${{ hashFiles('astro.config.mjs') }}
      - run: pnpm typecheck
      - run: pnpm build
        env:
          EMDASH_RUNTIME_MIGRATIONS: auto
      - run: pnpm check-links

  # main に入ったものだけを本番に出す。表を先に作り、それから Worker を出す
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro/fonts
          key: astro-fonts-${{ hashFiles('astro.config.mjs') }}
      - run: pnpm build
      # 指紋は wrangler.jsonc の account_id と D1 の番号から決まる。違う D1 を指したら止まる
      - run: >-
          pnpm exec emdash migrate --from-config --wrangler-config wrangler.jsonc
          --expected-target-fingerprint ac11fdb97c1541564e40d98d31f50f62b6eea9257068dd1500ba52d93bd3482d
      - run: pnpm exec wrangler deploy
